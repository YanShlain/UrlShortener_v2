server {
  listen 80;
  root /usr/share/nginx/html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location ~ "^/[0-9A-Za-z]{7}$" {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
